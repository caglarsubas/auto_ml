[pytest]
DJANGO_SETTINGS_MODULE = backend.settings
pythonpath = .
testpaths = tests
addopts =
    --strict-markers
    --strict-config
    -ra
# Fail any single test that hangs for more than 2 minutes (e.g. a background
# worker poll loop that never completes). Overridable per-test with
# @pytest.mark.timeout(...).
timeout = 120
markers =
    unit: Unit tests - isolated component tests (models, serializers, utilities)
    functional: Functional tests - API endpoint behavior and business logic
    regression: Regression tests - previously fixed bugs that must not recur
    integration: Integration tests - multi-component workflow tests
    uat: UAT tests - end-to-end user acceptance scenarios
