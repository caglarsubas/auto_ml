name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly full backend and governed browser run at 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Backend: Django + DRF pytest suite
  # ---------------------------------------------------------------------------
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Never emit Prometa OTLP telemetry from CI runs.
      PROMETA_DISABLE: "1"
      # The redis service is reachable on localhost from the job container.
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SETTINGS_MODULE: backend.settings
      # Bound native pools on shared runners. Keep dataset, round, assertion,
      # timeout and coverage budgets unchanged.
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmagic1 file libgomp1

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt

      - name: Select test scope
        id: scope
        run: |
          # Fast feedback on PRs; full suite on main / nightly / manual runs.
          # Coverage is only gated on the full suite (the quick PR subset has
          # lower coverage by construction).
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "markers=unit or regression" >> "$GITHUB_OUTPUT"
            echo "covfail=" >> "$GITHUB_OUTPUT"
          else
            echo "markers=unit or functional or regression or integration or uat" >> "$GITHUB_OUTPUT"
            echo "covfail=--cov-fail-under=50" >> "$GITHUB_OUTPUT"
          fi

      - name: Run pytest
        working-directory: backend
        run: |
          mkdir -p ../test-reports
          python -m pytest -m "${{ steps.scope.outputs.markers }}" \
            --tb=short \
            --junitxml=../test-reports/backend-junit.xml \
            --cov --cov-report=xml:../test-reports/backend-coverage.xml \
            --cov-report=term-missing ${{ steps.scope.outputs.covfail }}

      - name: Enforce skip budget
        if: always()
        run: python .github/scripts/check_skip_budget.py test-reports/backend-junit.xml --max-skips 15

      - name: Upload backend reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: test-reports/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Private configuration/TLS smoke, disposable restore and full metadata parity.
  postgresql-runtime:
    name: PostgreSQL runtime and metadata
    runs-on: ubuntu-latest
    env:
      PROMETA_DISABLE: "1"
      OPENAI_API_KEY: ""
      LLM_ENGINE_BASE_URL: http://127.0.0.1:9/v1
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmagic1 file libgomp1 openssl
          pip install -r backend/requirements.txt
      - name: Build allowlisted fixed private API runtime
        run: |
          python scripts/private_api_package.py context /tmp/declarai-private-context
          docker build -f /tmp/declarai-private-context/dependencies.Dockerfile -t declarai-private-dependencies:ci /tmp/declarai-private-context
          mkdir -p test-reports/postgresql
          python scripts/private_api_package.py build \
            --base-image "$(docker image inspect declarai-private-dependencies:ci --format '{{.Id}}')" \
            --tag declarai-private-api:ci > test-reports/postgresql/fixed-api-build.json
          python - <<'PY'
          import json, os
          record = json.load(open('test-reports/postgresql/fixed-api-build.json'))
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('DECLARAI_PRIVATE_API_IMAGE=' + record['image_id'] + '\n')
          PY
      - name: Qualify disposable PostgreSQL fixture
        run: python scripts/qualify_postgres_fixture.py --private-api-image "$DECLARAI_PRIVATE_API_IMAGE"
      - name: Enforce existing skip budget
        if: always()
        run: python .github/scripts/check_skip_budget.py test-reports/postgresql/postgresql.xml --max-skips 15
      - name: Upload PostgreSQL reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgresql-runtime-reports
          path: test-reports/postgresql/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Frontend: Angular Karma/Jasmine unit tests (headless Chrome)
  # ---------------------------------------------------------------------------
  frontend-unit:
    name: Frontend unit tests (Karma)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run unit tests
        working-directory: frontend
        run: npm run test:ci

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Backend static analysis (ruff)
  # ---------------------------------------------------------------------------
  backend-lint:
    name: Backend lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff>=0.9"
      - name: Ruff check
        working-directory: backend
        run: ruff check .

  # ---------------------------------------------------------------------------
  # Frontend static analysis (ESLint + Prettier)
  # ---------------------------------------------------------------------------
  frontend-lint:
    name: Frontend lint (ESLint + Prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: ESLint
        working-directory: frontend
        run: npm run lint
      - name: Prettier check (advisory)
        working-directory: frontend
        # Formatting is not yet enforced on the legacy tree; surface diffs
        # without failing the build. Flip to a hard gate once formatted.
        continue-on-error: true
        run: npm run format:check

  # ---------------------------------------------------------------------------
  # Frontend: real session/CSRF + API contracts on every PR and main run
  # ---------------------------------------------------------------------------
  frontend-e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    env:
      CI: "true"
      # Test accounts and their database exist only for this job.
      PROMETA_DISABLE: "1"
      OPENAI_API_KEY: ""
      LLM_ENGINE_BASE_URL: http://127.0.0.1:9/v1
      LLM_ENGINE_API_KEY: ci-unused
      E2E_BASE_URL: http://localhost:4300
      E2E_API_BASE_URL: http://localhost:8001/api/
      DECLARAI_JOB_BROKER_URL: redis://redis:6379/1
    steps:
      - uses: actions/checkout@v4

      - name: Start backend stack (backend + redis)
        run: docker compose -f docker-compose.yml -f docker-compose.ci-jobs.yml up -d --build backend redis

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Wait for backend session endpoint
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8001/api/auth/session/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs backend
          exit 1

      - name: Create disposable test credentials
        run: |
          python - <<'PY'
          import os, secrets
          password = secrets.token_urlsafe(32)
          print(f"::add-mask::{password}")
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f"E2E_USER=ci-session-{os.environ['GITHUB_RUN_ID']}\n")
              output.write(f"E2E_PASSWORD={password}\n")
          PY

      - name: Seed a non-admin account in the disposable database
        run: |
          docker compose exec -T -e E2E_USER -e E2E_PASSWORD \
            -e DECLARAI_TEST_INSTALLATION=1 backend python scripts/seed_e2e_user.py

      - name: Qualify scoped MCP over the actual stdio protocol
        run: |
          docker compose exec -T -e DECLARAI_TEST_INSTALLATION=1 \
            backend python scripts/qualify_mcp_stdio.py

      - name: Start bounded native worker and durable dispatcher
        run: |
          docker compose exec -d -e DECLARAI_JOB_BROKER_URL backend sh -c 'cd backend && exec python -m celery -A backend.celery:app worker --concurrency=2 --without-gossip --without-mingle --without-heartbeat --loglevel=WARNING > /tmp/native-worker.log 2>&1'
          docker compose exec -d -e DECLARAI_JOB_BROKER_URL backend sh -c 'cd backend && exec python manage.py dispatch_jobs > /tmp/native-dispatcher.log 2>&1'

      - name: Build and serve frontend assets
        run: |
          npm --prefix frontend run build
          node scripts/serve_frontend.mjs frontend/dist/frontend/browser 4300 > /tmp/frontend-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS -H 'Accept: text/html' http://localhost:4300/login >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/frontend-preview.log
          exit 1

      - name: Run governed browser and authenticated API contracts
        working-directory: frontend
        run: npm run test:e2e:governed

      - name: Reproduce native CSV scores without network or installation data
        run: |
          python scripts/qualify_offline_scoring.py \
            --runtime-image "$(docker compose images -q backend)" \
            --inputs frontend/test-results --reports test-reports/offline-scoring

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            test-reports/offline-scoring/
          if-no-files-found: ignore

      - name: Tear down stack
        if: always()
        run: docker compose down -v
