# Pre-commit hooks for DeclarAI.
#
# Install once with:
#   pip install pre-commit
#   pre-commit install                 # lint/format on every commit
#   pre-commit install --hook-type pre-push  # run quick backend tests before push
#
# The quick backend test suite is wired to the pre-push stage (not pre-commit)
# so day-to-day commits stay fast while still blocking broken pushes.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.4
    hooks:
      - id: ruff
        name: ruff (backend lint)
        files: ^backend/
        args: ["--fix"]
      - id: ruff-format
        name: ruff (backend format)
        files: ^backend/

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        name: prettier (frontend)
        files: ^frontend/src/.*\.(ts|html|scss|css|json)$
        additional_dependencies:
          - prettier@3.3.3

  - repo: local
    hooks:
      - id: backend-quick-tests
        name: backend quick tests (unit + regression)
        entry: bash -c './run_tests.sh --quick --mode native'
        language: system
        pass_filenames: false
        stages: [pre-push]
