services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - path: .env
        required: false
    environment:
      - DJANGO_ALLOWED_HOSTS=*
      - DATQ_MAX_CELLS=20000000
      - DATQ_SAMPLE_ROWS=10000
      - REDIS_URL=redis://redis:6379/0
      # Local llm-inference-engine — used by DeclarAI when a model is
      # registered with provider='engine'. The engine runs as a separate
      # service (see llm_inference_engine_v1/); host.docker.internal points
      # the container at the engine on the developer host. Override via .env
      # for production / CI deployments.
      #
      # Default port 8080 = native (Metal) engine binding directly on the
      # host. Use 8090 if you're running the containerised topology with
      # nginx in front of multiple engine replicas.
      - LLM_ENGINE_BASE_URL=${LLM_ENGINE_BASE_URL:-http://host.docker.internal:8080/v1}
      # Required when engine auth is enabled. Do not commit the raw key; set it
      # in .env or the deployment secret manager for the declarai-auto-ml tenant.
      - LLM_ENGINE_API_KEY=${LLM_ENGINE_API_KEY:?set LLM_ENGINE_API_KEY from the private engine secret handoff}
    depends_on:
      - redis
    # Mount project root for live-reload development (Django autoreload).
    # Named chroma-data volume overlays backend/.chroma so the vector index
    # survives container recreation even though the bind-mount covers /app.
    volumes:
      - .:/app
      - chroma-data:/app/backend/.chroma
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "4300:4300"
    depends_on:
      - backend
    # Mount frontend source so Angular dev server rebuilds on change; keep container node_modules
    volumes:
      - ./frontend:/app
      - /app/node_modules
volumes:
  redis-data:
  chroma-data:
