services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - DJANGO_ALLOWED_HOSTS=*
      - DATQ_MAX_CELLS=20000000
      - DATQ_SAMPLE_ROWS=10000
    # Mount project root for live-reload development (Django autoreload)
    volumes:
      - .:/app
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "4300:4300"
    depends_on:
      - backend
    # Mount frontend source so Angular dev server rebuilds on change; keep container node_modules
    volumes:
      - ./frontend:/app
      - /app/node_modules
