services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - DJANGO_ALLOWED_HOSTS=*
      - DATQ_MAX_CELLS=20000000
      - DATQ_SAMPLE_ROWS=10000
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - redis
      - ollama
    # Mount project root for live-reload development (Django autoreload)
    volumes:
      - .:/app
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "4300:4300"
    depends_on:
      - backend
    # Mount frontend source so Angular dev server rebuilds on change; keep container node_modules
    volumes:
      - ./frontend:/app
      - /app/node_modules
volumes:
  redis-data:
  ollama-models:
