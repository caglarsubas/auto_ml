<div class="ai-chat-panel">
  <!-- Header -->
  <div class="chat-header">
    <div class="chat-header-title">
      <span class="chat-header-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M10 2L12.5 9.5L20 12L12.5 14.5L10 22L7.5 14.5L0 12L7.5 9.5L10 2Z" fill="currentColor"/><path d="M20 4L21 7L24 8L21 9L20 12L19 9L16 8L19 7L20 4Z" fill="currentColor" opacity="0.7"/><path d="M20 16L20.75 18.25L23 19L20.75 19.75L20 22L19.25 19.75L17 19L19.25 18.25L20 16Z" fill="currentColor" opacity="0.5"/></svg></span>
      <span>AI Assistant</span>
    </div>
    <div class="chat-header-actions">
      <button class="chat-action-btn" (click)="clearChat()" title="Clear chat">
        <span>&#128465;</span>
      </button>
      <button class="chat-action-btn" (click)="aiService.closePanel()" title="Close panel">
        <span>&times;</span>
      </button>
    </div>
  </div>

  <!-- Messages -->
  <div class="chat-messages" #chatContainer>
    <div *ngIf="messages.length === 0" class="chat-empty">
      <div class="chat-empty-icon"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M10 2L12.5 9.5L20 12L12.5 14.5L10 22L7.5 14.5L0 12L7.5 9.5L10 2Z" fill="currentColor"/><path d="M20 4L21 7L24 8L21 9L20 12L19 9L16 8L19 7L20 4Z" fill="currentColor" opacity="0.7"/><path d="M20 16L20.75 18.25L23 19L20.75 19.75L20 22L19.25 19.75L17 19L19.25 18.25L20 16Z" fill="currentColor" opacity="0.5"/></svg></div>
      <div class="chat-empty-title">DeclarAI Assistant</div>
      <div class="chat-empty-text">
        Ask questions about your pipeline results, or click
        <strong>"Get AI Support"</strong> on any output section to get instant insights.
      </div>
    </div>

    <div *ngFor="let msg of messages" class="chat-message" [class.user]="msg.role === 'user'" [class.assistant]="msg.role === 'assistant'">
      <div class="chat-message-avatar">
        <span *ngIf="msg.role === 'user'">&#128100;</span>
        <span *ngIf="msg.role === 'assistant'"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M10 2L12.5 9.5L20 12L12.5 14.5L10 22L7.5 14.5L0 12L7.5 9.5L10 2Z" fill="currentColor"/><path d="M20 4L21 7L24 8L21 9L20 12L19 9L16 8L19 7L20 4Z" fill="currentColor" opacity="0.7"/><path d="M20 16L20.75 18.25L23 19L20.75 19.75L20 22L19.25 19.75L17 19L19.25 18.25L20 16Z" fill="currentColor" opacity="0.5"/></svg></span>
      </div>
      <div class="chat-message-body">
        <div class="chat-message-role">{{ msg.role === 'user' ? 'You' : 'AI Assistant' }}</div>
        <div class="chat-message-content" *ngIf="!msg.loading">
          <div [innerHTML]="formatMessage(msg.content)"></div>
        </div>
        <div class="chat-message-content loading" *ngIf="msg.loading">
          <div class="typing-indicator">
            <span></span><span></span><span></span>
          </div>
        </div>
        <div class="chat-message-section" *ngIf="msg.section">
          {{ getSectionLabel(msg.section) }}
        </div>
      </div>
    </div>
  </div>

  <!-- Input -->
  <div class="chat-input-area">
    <textarea
      class="chat-input"
      [(ngModel)]="userInput"
      (keydown)="onKeyDown($event)"
      placeholder="Ask about your results..."
      rows="1"
      [disabled]="isLoading"
    ></textarea>
    <button class="chat-send-btn" (click)="sendMessage()" [disabled]="!userInput.trim() || isLoading" title="Send">
      <span>&#10148;</span>
    </button>
  </div>
</div>
