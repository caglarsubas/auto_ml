<div class="home" data-testid="home-surface">
  <!-- Monoline icon sprite (Precision Editorial — stroke marks, not filled circles) -->
  <svg xmlns="http://www.w3.org/2000/svg" class="home-sprite" aria-hidden="true" focusable="false">
    <symbol id="hi-layers" viewBox="0 0 24 24">
      <path d="M12 4.5 3.5 9 12 13.5 20.5 9 12 4.5Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M3.5 12.5 12 17l8.5-4.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M3.5 16 12 20.5 20.5 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="hi-model" viewBox="0 0 24 24">
      <rect x="4" y="4" width="7" height="7" rx="1.25" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <rect x="13" y="4" width="7" height="7" rx="1.25" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <rect x="4" y="13" width="7" height="7" rx="1.25" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <path d="M13 16.5h7M16.5 13v7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </symbol>
    <symbol id="hi-deploy" viewBox="0 0 24 24">
      <path d="M12 3.5v10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M8.5 7.5 12 3.5l3.5 4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M5 14.5v3A2.5 2.5 0 0 0 7.5 20h9A2.5 2.5 0 0 0 19 17.5v-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </symbol>
    <symbol id="hi-report" viewBox="0 0 24 24">
      <path d="M7 3.5h7.5L19.5 8.5V20a.5.5 0 0 1-.5.5H7a.5.5 0 0 1-.5-.5V4A.5.5 0 0 1 7 3.5Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M14 3.5V9h5.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M9 13h6M9 16.5h4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </symbol>
    <symbol id="hi-about" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="8.25" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <path d="M12 10.5V17" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="12" cy="7.75" r="0.9" fill="currentColor"/>
    </symbol>
    <symbol id="hi-arrow" viewBox="0 0 24 24">
      <path d="M5 12h12.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M13.5 7.5 18.5 12l-5 4.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="hi-declare" viewBox="0 0 24 24">
      <path d="M7 4h8.5L19 7.5V20H7V4Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M15 4v4h4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M10 12h4M10 15.5h2.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </symbol>
    <symbol id="hi-seal" viewBox="0 0 24 24">
      <path d="M12 3.5 14.2 5h3.3v3.2L19.5 10.5 17.5 12.7V16H14.2L12 18.2 9.8 16H6.5v-3.3L4.5 10.5 6.5 8.2V5h3.3L12 3.5Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M9.8 12.1 11.2 13.5 14.4 10.2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="hi-route" viewBox="0 0 24 24">
      <circle cx="6.5" cy="7" r="2.25" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <circle cx="17.5" cy="17" r="2.25" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <path d="M8.7 8.2c2.4 1.2 4.2 4.8 6.6 6.6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </symbol>
    <symbol id="hi-roadmap" viewBox="0 0 24 24">
      <path d="M4.5 7h15M4.5 12h15M4.5 17h10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="8" cy="7" r="1.4" fill="currentColor"/>
      <circle cx="14" cy="12" r="1.4" fill="currentColor"/>
      <circle cx="11" cy="17" r="1.4" fill="currentColor"/>
    </symbol>
  </svg>

  <div class="home-atmosphere" aria-hidden="true"></div>

  <div class="home-layout">
    <main class="home-main">
      <header class="home-hero">
        <p class="home-kicker">Case file · workspace</p>
        <h1 class="home-brand">declar.ai</h1>
        <p class="home-thesis">{{ thesis }}</p>
        <div class="home-actions">
          <a
            routerLink="/model-development"
            class="home-cta-primary"
            data-testid="home-primary-cta">
            <svg class="home-cta-icon" aria-hidden="true"><use href="#hi-model"></use></svg>
            Model Development
            <svg class="home-cta-icon home-cta-icon--trail" aria-hidden="true"><use href="#hi-arrow"></use></svg>
          </a>
          <a
            routerLink="/model-development/declaration"
            class="home-cta-secondary"
            data-testid="home-secondary-cta">
            <svg class="home-cta-icon" aria-hidden="true"><use href="#hi-declare"></use></svg>
            Start Declaration
          </a>
        </div>
      </header>

      <section class="home-directory" aria-label="Workspace directory">
        <div class="home-directory-head">
          <h2 class="home-directory-title">Directory</h2>
          <p class="home-directory-note">Live stages open. Planned stages stay labeled.</p>
        </div>

        <div class="home-directory-grid">
          <article *ngFor="let section of sections" class="home-section">
            <header class="home-section-head">
              <span class="home-section-mark" aria-hidden="true" data-testid="home-section-icon">
                <svg class="home-icon"><use [attr.href]="'#hi-' + section.icon"></use></svg>
              </span>
              <div class="home-section-titles">
                <span class="home-section-index">{{ section.index }}</span>
                <h3 class="home-section-name">{{ section.name }}</h3>
              </div>
            </header>
            <ul class="home-section-list">
              <li *ngFor="let item of section.items" class="home-row">
                <a
                  *ngIf="item.status === 'live' && item.route"
                  [routerLink]="item.route"
                  class="home-entry home-entry--live">
                  <span class="home-entry-main">
                    <svg class="home-entry-icon" aria-hidden="true"><use href="#hi-arrow"></use></svg>
                    <span class="home-entry-label">{{ item.label }}</span>
                  </span>
                  <span class="home-entry-meta">Open</span>
                </a>
                <div
                  *ngIf="item.status === 'unavailable'"
                  class="home-entry home-entry--unavailable"
                  aria-disabled="true">
                  <span class="home-entry-main">
                    <span class="home-entry-dot" aria-hidden="true"></span>
                    <span class="home-entry-label">{{ item.label }}</span>
                  </span>
                  <span class="home-entry-meta">Unavailable</span>
                </div>
              </li>
            </ul>
          </article>
        </div>
      </section>
    </main>

    <aside class="home-evidence" aria-label="Evidence margin">
      <h2 class="home-evidence-title">Evidence</h2>
      <ol class="home-evidence-list">
        <li
          *ngFor="let note of evidenceNotes"
          class="home-evidence-item"
          [class.home-evidence-item--declared]="note.tone === 'declared'"
          [class.home-evidence-item--live]="note.tone === 'live'"
          [class.home-evidence-item--muted]="note.tone === 'muted'">
          <span class="home-evidence-mark" aria-hidden="true">
            <svg class="home-icon home-icon--sm"><use [attr.href]="'#hi-' + note.icon"></use></svg>
          </span>
          <div class="home-evidence-copy">
            <span class="home-evidence-label">{{ note.label }}</span>
            <p class="home-evidence-body">{{ note.body }}</p>
          </div>
        </li>
      </ol>
    </aside>
  </div>
</div>
