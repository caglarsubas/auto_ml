<!-- src/app/app.component.html -->

<ng-container *ngIf="isBrowser">

  <mat-toolbar color="primary" class="app-toolbar">
    <a routerLink="/home" class="logo-container" aria-label="declar.ai home">
      <img src="assets/declarai_logo_4_transparent.png" alt="declar.ai" class="logo">
    </a>

    <span class="spacer"></span>

    <ng-container *ngIf="isLoginPage">
      <a mat-button [matMenuTriggerFor]="About">About</a>
      <mat-menu #About="matMenu">
        <button mat-menu-item disabled>User Guide</button>
        <button mat-menu-item disabled>White Paper</button>
        <button mat-menu-item disabled>Team & Community</button>
        <button mat-menu-item disabled>References</button>
      </mat-menu>
    </ng-container>

    <ng-container *ngIf="!isLoginPage">
      <a mat-button routerLink="/home">Home</a>
      <a mat-button [matMenuTriggerFor]="FeatureStore">Feature Store</a>
      <mat-menu #FeatureStore="matMenu">
        <button mat-menu-item routerLink="/feature-store/collections">Feature Collection</button>
        <button mat-menu-item disabled>Feature Engineering</button>
        <button mat-menu-item disabled>Feature Monitoring</button>
      </mat-menu>
      <a mat-button [matMenuTriggerFor]="ModelStore">Model Store</a>
      <mat-menu #ModelStore="matMenu">
        <button mat-menu-item routerLink="/model-development">Model Development</button>
        <button mat-menu-item disabled>Model Re-Fitting</button>
        <button mat-menu-item disabled>Model Monitoring</button>
      </mat-menu>
      <a mat-button [matMenuTriggerFor]="Deployments">Deployments</a>
      <mat-menu #Deployments="matMenu">
        <button mat-menu-item disabled>Deployed Artifacts</button>
        <button mat-menu-item disabled>Security Monitoring</button>
        <button mat-menu-item disabled>Performance Monitoring</button>
        <button mat-menu-item disabled>New Deployment</button>
      </mat-menu>
      <a mat-button [matMenuTriggerFor]="Reporting">Reporting</a>
      <mat-menu #Reporting="matMenu">
        <button mat-menu-item disabled>Model Summary</button>
        <button mat-menu-item disabled>Quality Report</button>
        <button mat-menu-item disabled>Explainability</button>
        <button mat-menu-item disabled>Causality</button>
      </mat-menu>
      <button mat-button class="sign-out-btn" (click)="onSignOut()">Sign Out</button>
    </ng-container>

  </mat-toolbar>

<div class="content-container">
  <router-outlet></router-outlet>
</div>

</ng-container>
